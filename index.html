<title>Treino</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#181b21;
    --card2:#1f232b;
    --border:#2a2f3a;
    --text:#f2f3f5;
    --muted:#9aa1ac;
    --accent:#ff6a3d;
    --accent2:#3ddc97;
    --danger:#ff5c5c;
    --shadow:0 10px 28px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.28);
    --shadow-sm:0 4px 14px rgba(0,0,0,.3);
    --header-bg:rgba(15,17,21,.7);
    --nav-bg:rgba(18,20,26,.78);
    --nav-shadow:0 -8px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f5f7;
    --card:#ffffff;
    --card2:#eef0f3;
    --border:#e1e4e9;
    --text:#14171c;
    --muted:#6b7280;
    --accent:#ff5a2a;
    --accent2:#1fa971;
    --danger:#e0483f;
    --shadow:0 10px 28px rgba(20,23,28,.1),0 2px 8px rgba(20,23,28,.06);
    --shadow-sm:0 4px 14px rgba(20,23,28,.07);
    --header-bg:rgba(244,245,247,.7);
    --nav-bg:rgba(255,255,255,.8);
    --nav-shadow:0 -8px 24px rgba(20,23,28,.1);
  }
  html{scroll-behavior:smooth;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:90px;
    transition:background .2s ease,color .2s ease;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:var(--header-bg);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    padding:18px 16px 10px;
    transition:background .2s ease;
  }
  header h1{
    font-size:1.32rem;font-weight:800;
    margin:0 0 2px;
    letter-spacing:-.01em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:.8rem;
    letter-spacing:.01em;
  }
  .header-row{display:flex;justify-content:space-between;align-items:center;}
  .theme-toggle{
    flex:0 0 auto;width:38px;height:38px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);
    box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .theme-toggle:active{transform:scale(.9);box-shadow:none;}
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}
  .progress-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:18px;
    margin:14px 0;
  }
  .progress-top{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;
  }
  .progress-top .label{font-weight:700;font-size:1rem;letter-spacing:-.01em;}
  .progress-top .pct{
    font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .bar-bg{
    height:10px;background:var(--card2);border-radius:8px;overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.15);
  }
  .bar-fill{
    height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:8px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%;
    box-shadow:0 0 12px rgba(255,106,61,.4);
  }
  .group{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow-sm);
    margin:12px 0;
    overflow:hidden;
  }
  .group h2{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    font-weight:700;
    color:var(--muted);
    margin:0;
    padding:14px 14px 6px;
  }
  .item{
    display:flex;flex-direction:column;gap:9px;
    padding:12px 14px;
    border-top:1px solid var(--border);
    transition:background .25s ease;
  }
  .item:first-of-type{border-top:none;}
  .item.done{background:rgba(61,220,151,.08);}
  .item-top{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .item-name{
    font-size:.96rem;font-weight:600;letter-spacing:-.01em;line-height:1.3;
    transition:color .25s ease;
  }
  .item.done .item-name{color:var(--muted);text-decoration:line-through;}
  .item-detail{
    font-size:.82rem;color:var(--accent);font-weight:700;white-space:nowrap;
    transition:color .25s ease;
  }
  .item.done .item-detail{color:var(--muted);}
  .set-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .set-pill{
    flex:0 0 auto;
    width:36px;height:36px;border-radius:12px;
    border:2px solid var(--border);
    background:var(--card2);
    color:var(--muted);
    font-weight:700;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease;
  }
  .set-pill svg{width:15px;height:15px;}
  .set-pill.done{
    background:var(--accent2);border-color:var(--accent2);color:#0f1115;
    box-shadow:0 4px 14px rgba(61,220,151,.4);
  }
  .set-pill:active{transform:scale(.9);}
  .set-pill.pop{animation:popScale .38s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popScale{0%{transform:scale(1);}45%{transform:scale(1.2);}100%{transform:scale(1);}}
  .finish-btn{
    display:block;width:100%;
    background:linear-gradient(135deg,var(--accent),var(--accent2) 160%);
    color:#fff;border:none;
    font-size:1rem;font-weight:800;letter-spacing:-.01em;
    padding:16px;border-radius:16px;margin:20px 0 6px;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(255,106,61,.35);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .finish-btn:active{transform:scale(.97);box-shadow:0 4px 14px rgba(255,106,61,.3);}
  .reset-link{
    display:block;text-align:center;color:var(--muted);
    font-size:.82rem;margin:10px 0 4px;background:none;border:none;
    width:100%;padding:8px;cursor:pointer;text-decoration:underline;
    transition:opacity .15s ease;
  }
  .reset-link:active{opacity:.6;}
  .history{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    box-shadow:var(--shadow-sm);
    padding:16px;margin:14px 0;
  }
  .history h2{
    font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;
    color:var(--muted);margin:0 0 10px;
  }
  .history-empty{color:var(--muted);font-size:.85rem;}
  .history-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-top:1px solid var(--border);font-size:.88rem;
    gap:8px;
  }
  .history-row:first-of-type{border-top:none;}
  .history-right{display:flex;align-items:center;gap:10px;}
  .history-del{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;
    border:none;background:var(--card2);color:var(--danger);
    font-size:1rem;line-height:1;font-weight:700;cursor:pointer;
    transition:transform .15s ease;
  }
  .history-del:active{transform:scale(.85);}
  .history-badge{
    display:inline-block;width:26px;height:26px;line-height:26px;
    text-align:center;border-radius:8px;font-weight:800;font-size:.8rem;
    margin-right:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .badge-A{background:#ff6a3d33;color:#ff6a3d;}
  .badge-B{background:#3ddc9733;color:#3ddc97;}
  .badge-C{background:#5c9cff33;color:#5c9cff;}
  .badge-D{background:#b26cff33;color:#b26cff;}
  .badge-E{background:#ff6cae33;color:#ff6cae;}
  .badge-ABS{background:#e0d43d33;color:#e0d43d;}
  .rules-list{margin:0;padding:0;list-style:none;}
  .rules-list li{
    padding:12px 14px;border-top:1px solid var(--border);
    font-size:.92rem;line-height:1.4;
  }
  .rules-list li:first-child{border-top:none;}
  .rules-list li::before{content:"→ ";color:var(--accent);font-weight:700;}
  nav{
    background:var(--nav-bg);border-top:1px solid var(--border);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    box-shadow:var(--nav-shadow);
    display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1;background:none;border:none;color:var(--muted);
    font-size:.72rem;font-weight:600;padding:8px 2px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    transition:color .18s ease,background .18s ease,transform .12s ease;
  }
  nav button:active{transform:scale(.94);}
  nav button .dot{
    width:8px;height:8px;border-radius:50%;background:var(--border);
    transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  nav button.active{color:var(--text);background:var(--card2);}
  nav button.active .dot{background:var(--accent);transform:scale(1.15);box-shadow:0 0 8px var(--accent);}
  .center-nav-wrap{max-width:480px;margin:0 auto;position:fixed;bottom:0;left:0;right:0;}
  #content.fade-in{animation:fadeInUp .3s cubic-bezier(.16,1,.3,1);}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .rest-timer{
    max-width:480px;margin:0 auto;
    background:var(--card);
    border-top-left-radius:20px;border-top-right-radius:20px;
    box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 16px;max-height:0;opacity:0;overflow:hidden;

function cloudHistoryRef(profileId){
  return db ? db.ref("history/" + profileId) : null;
}

function syncHistoryEntryToCloud(profileId, entry){
  const ref = cloudHistoryRef(profileId);
  if (!ref) return;
  try { ref.child(entry.id).set(entry); } catch(e){ console.log("Erro ao sincronizar histórico:", e.message); }
}

function removeHistoryEntryFromCloud(profileId, id){
  const ref = cloudHistoryRef(profileId);
  if (!ref) return;
  try { ref.child(id).remove(); } catch(e){ console.log("Erro ao remover histórico da nuvem:", e.message); }
}

let otherHistory = [];
let otherHistoryVisible = false;
function loadOtherHistory(callback){
  const otherId = currentProfile === "victor" ? "kaio" : "victor";
  const ref = cloudHistoryRef(otherId);
  if (!ref){ callback(); return; }
  ref.once("value").then(snap => {
    const val = snap.val() || {};
    otherHistory = Object.values(val);
    callback();
  }).catch(() => { callback(); });
}

function stateKey(){ return "treinoAppState_v1_" + currentProfile; }

  hideProfileGate();
  updateProfileSwitchLabel();
  hideRestTimer();
  hideCompleteOverlay();
  render();

let restTimerInterval = null;
let restRemaining = 0;

function updateRestTimerUI(){
  const el = document.getElementById("restTimer");
  if (!el) return;
  const m = Math.floor(restRemaining / 60);
  const s = restRemaining % 60;
  const timeStr = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  el.innerHTML = '<div class="rt-info"><span class="rt-label">Descanso</span><span class="rt-time">' + timeStr + '</span></div>' +
    '<div class="rt-actions"><button class="rt-add" id="rtAdd">+15s</button><button class="rt-skip" id="rtSkip">Pular</button></div>';
  document.getElementById("rtAdd").addEventListener("click", () => {
    restRemaining += 15;
    updateRestTimerUI();
  });
  document.getElementById("rtSkip").addEventListener("click", hideRestTimer);
}

function showRestTimer(seconds){
  clearInterval(restTimerInterval);
  restRemaining = seconds;
  const el = document.getElementById("restTimer");
  updateRestTimerUI();
  if (el) el.classList.add("show");
  restTimerInterval = setInterval(() => {
    restRemaining--;
    if (restRemaining <= 0){
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      hideRestTimer();
      if (navigator.vibrate) navigator.vibrate([120,80,120]);
      return;
    }
    updateRestTimerUI();
  }, 1000);
}

function hideRestTimer(){
  clearInterval(restTimerInterval);
  restTimerInterval = null;
  const el = document.getElementById("restTimer");
  if (el) el.classList.remove("show");
}

let completeOverlayTimer = null;

function showCompleteOverlay(title){

  overlay.classList.add("show");
  clearTimeout(completeOverlayTimer);
  completeOverlayTimer = setTimeout(hideCompleteOverlay, 4000);
}

function hideCompleteOverlay(){
  const overlay = document.getElementById("completeOverlay");
  if (!overlay) return;
  overlay.classList.remove("show");
  clearTimeout(completeOverlayTimer);
  completeOverlayTimer = null;
}

(function initCompleteOverlay(){
  const overlay = document.getElementById("completeOverlay");
  const closeBtn = document.getElementById("completeCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", hideCompleteOverlay);
  if (overlay) overlay.addEventListener("click", (e) => {
    if (e.target.id === "completeOverlay") hideCompleteOverlay();
  });
})();

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_KEY, theme);
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "light" ? "☀️" : "🌙";
}

(function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
})();

function loadState(){
  try { return JSON.parse(localStorage.getItem(stateKey())) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  localStorage.setItem(stateKey(), JSON.stringify(state));
}
function loadHistory(){
  try { return JSON.parse(localStorage.getItem(historyKey())) || []; }
  catch(e){ return []; }
}
function saveHistory(hist){
  localStorage.setItem(historyKey(), JSON.stringify(hist));
}

let history = [];

function initProfileData(){
  state = loadState();
  history = loadHistory();

  history.forEach(h => {
    if (!h.id){ h.id = Date.now() + "_" + Math.random().toString(36).slice(2); historyNeedsIds = true; }
  });
  if (historyNeedsIds) saveHistory(history);
  currentTab = TAB_ORDER[0];

function itemId(tabKey, groupIdx, itemIdx){
  return tabKey + "_" + groupIdx + "_" + itemIdx;
}

function parseSets(detail){
  if (!detail) return 1;
  let m = detail.match(/^(\d+)\s*x/i);
  if (m) return parseInt(m[1], 10);
  m = detail.match(/^(\d+)\s*s[ée]ries/i);
  if (m) return parseInt(m[1], 10);
  return 1;
}

function setKey(tabKey, gi, ii, si){
  return itemId(tabKey, gi, ii) + "_s" + si;
}

function countProgress(tabKey){
  const t = DATA[tabKey];
  let total = 0, done = 0;
  t.groups.forEach((g, gi) => {
    g.items.forEach((it, ii) => {
      const n = parseSets(it[1]);
      total += n;
      for (let si = 0; si < n; si++){
        if (state[setKey(tabKey, gi, ii, si)]) done++;
      }
    });
  });
  return { total, done };
}

function fadeContent(){
  const el = document.getElementById("content");
  if (!el) return;
  el.classList.remove("fade-in");
  void el.offsetWidth;
  el.classList.add("fade-in");
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TAB_ORDER.forEach(key => {
    const btn = document.createElement("button");
    btn.className = key === currentTab ? "active" : "";
    btn.innerHTML = '<span class="dot"></span><span>' + DATA[key].label + '</span>';
    btn.onclick = () => { currentTab = key; render(); fadeContent(); window.scrollTo(0,0); };
    nav.appendChild(btn);
  });
}

function formatDate(iso){
  const d = new Date(iso);
  const dias = ["dom","seg","ter","qua","qui","sex","sáb"];
  const data = dias[d.getDay()] + " " + String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
  const hora = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return data + " · " + hora;
}

function renderWorkoutPage(tabKey){
  const t = DATA[tabKey];
  const { total, done } = countProgress(tabKey);
  const pct = total ? Math.round((done/total)*100) : 0;

  let html = '';
  html += '<div class="progress-card">';
  html += '<div class="progress-top"><span class="label">' + t.subtitle + '</span><span class="pct">' + pct + '%</span></div>';
  html += '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
  html += '</div>';

  t.groups.forEach((g, gi) => {
    html += '<div class="group"><h2>' + g.name + '</h2>';
    g.items.forEach((it, ii) => {
      const n = parseSets(it[1]);
      let allDone = true;
      let pillsHtml = '';
      for (let si = 0; si < n; si++){
        const sDone = !!state[setKey(tabKey, gi, ii, si)];
        if (!sDone) allDone = false;
        const label = n === 1
          ? '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : (si + 1);
        pillsHtml += '<button class="set-pill ' + (sDone?'done':'') + '" data-setkey="' + setKey(tabKey, gi, ii, si) + '" data-exname="' + it[0].replace(/"/g,'&quot;') + '" data-rest="' + (it[2] || REST_DURATION) + '" data-cardio="' + (g.name === "Cardio" ? "1" : "0") + '">' + label + '</button>';
      }
      html += '<div class="item ' + (allDone?'done':'') + '">';
      html += '<div class="item-top"><div class="item-name">' + it[0] + '</div>';
      if (it[1]) html += '<div class="item-detail">' + it[1] + '</div>';
      html += '</div>';
      html += '<div class="set-pills">' + pillsHtml + '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  html += '<button class="finish-btn" id="finishBtn">Concluir ' + t.title + ' de hoje</button>';
  html += '<button class="reset-link" id="resetBtn">Desmarcar tudo neste treino</button>';

  document.getElementById("content").innerHTML = html;

  document.querySelectorAll(".set-pill").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.getAttribute("data-setkey");
      const exName = el.getAttribute("data-exname") || "";
      const exRest = parseInt(el.getAttribute("data-rest"), 10) || REST_DURATION;
      const isCardio = el.getAttribute("data-cardio") === "1";
      state[key] = !state[key];
      const nowDone = !!state[key];
      saveState(state);
      render();
      if (nowDone){
        const newEl = document.querySelector('.set-pill[data-setkey="' + key + '"]');
        if (newEl){
          newEl.classList.add("pop");
          newEl.addEventListener("animationend", () => newEl.classList.remove("pop"), { once:true });
        }
        if (!isCardio) showRestTimer(exRest);
      } else {
        hideRestTimer();
      }
    });
  });

    document.getElementById("finishBtn").addEventListener("click", () => {
    const id = Date.now() + "_" + Math.random().toString(36).slice(2);
    const entry = { id, tab: tabKey, label: t.title, date: new Date().toISOString(), owner: currentProfile };
    history.unshift(entry);
    history = history.slice(0, 20);
    saveHistory(history);
    syncHistoryEntryToCloud(currentProfile, entry);
    t.groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      const n = parseSets(it[1]);
      for (let si = 0; si < n; si++) delete state[setKey(tabKey, gi, ii, si)];
    }));
    saveState(state);
    render();
    fadeContent();
    hideRestTimer();
    showCompleteOverlay(t.title);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    t.groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      const n = parseSets(it[1]);
      for (let si = 0; si < n; si++) delete state[setKey(tabKey, gi, ii, si)];
    }));
    saveState(state);
    render();
    fadeContent();
    hideRestTimer();
  });
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function enableNotifications(){
  const statusEl = document.getElementById("notifStatus");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)){
    if (statusEl) statusEl.textContent = "Seu navegador não suporta notificações push.";
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted"){
      if (statusEl) statusEl.textContent = "Permissão negada. Ative nas configurações do navegador pra tentar de novo.";
      return;
    }
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = JSON.stringify(sub, null, 2);
    const textEl = document.getElementById("notifSubJson");
    const resultEl = document.getElementById("notifResult");
    if (textEl) textEl.value = json;
    if (resultEl) resultEl.style.display = "block";
    if (statusEl) statusEl.textContent = "";
  } catch (e){
    if (statusEl) statusEl.textContent = "Erro ao ativar: " + e.message;
  }
}
