name: Lembrete de treino

on:
  schedule:
    - cron: "3 11 * * 1-5"    # Bom dia - 08:03 horário de Brasília, seg-sex
    - cron: "4 15 * * 1-5"    # Almoço  - 12:04 horário de Brasília, seg-sex
    - cron: "53 20 * * 1-5"   # Treino  - 17:53 horário de Brasília, seg-sex
  workflow_dispatch:           # permite rodar manualmente, ou via chamada externa
    inputs:
      message:
        description: "Qual mensagem enviar: bomdia, almoco, treino ou vazio (testa as 3)"
        required: false
        default: ""

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm install web-push

      - name: Enviar notificação
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SCHEDULE: ${{ github.event.schedule }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: node send-notification.js
