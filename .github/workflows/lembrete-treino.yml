name: Lembrete de treino

on:
  # Sem "schedule" nativo do GitHub — quem dispara agora é só o cron-job.org,
  # pra evitar notificação duplicada (o agendamento nativo do GitHub não era confiável).
  workflow_dispatch:
    inputs:
      message:
        description: "Qual mensagem enviar: bomdia, almoco, treino ou vazio (testa as 3)"
        required: false
        default: ""

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm install web-push

      - name: Enviar notificação
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: node send-notification.js
